openapi: 3.0.3
info:
  title: SIPUS-Del RESTful Web API Specification
  version: 1.0.0
  description: >
    Kontrak resmi layanan RESTful Web API Sistem Informasi Perpustakaan Kampus Del (SIPUS-Del API v1).
    Mengimplementasikan Richardson Maturity Model (RMM) Level 3 (HATEOAS), standar penanganan galat IETF RFC 7807 (Problem Details),
    serta otentikasi stateless Bearer Token berbasis Laravel Sanctum.
servers:
  - url: http://localhost:8000/api/v1
    description: Development Server Lokal

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Masukkan token akses hasil login pustakawan dari endpoint POST /auth/login.

  schemas:
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          example: "http://localhost:8000/docs/errors/validation-failed"
        title:
          type: string
          example: "Unprocessable Content"
        status:
          type: integer
          example: 422
        detail:
          type: string
          example: "Satu atau lebih atribut input yang dikirim tidak memenuhi aturan validasi."
        instance:
          type: string
          example: "/api/v1/bukus"
        errors:
          type: object
          nullable: true

    BukuInput:
      type: object
      required: [kategori_id, isbn, judul, penulis, stok]
      properties:
        kategori_id:
          type: integer
          example: 1
        isbn:
          type: string
          example: "9780132350884"
        judul:
          type: string
          example: "Clean Code: A Handbook of Agile Software Craftsmanship"
        penulis:
          type: string
          example: "Robert C. Martin"
        penerbit:
          type: string
          nullable: true
          example: "Prentice Hall"
        tahun_terbit:
          type: integer
          nullable: true
          example: 2008
        stok:
          type: integer
          minimum: 0
          example: 10

    PeminjamanInput:
      type: object
      required: [buku_id, nim_peminjam, nama_peminjam]
      properties:
        buku_id:
          type: integer
          example: 1
        nim_peminjam:
          type: string
          example: "12S24029"
        nama_peminjam:
          type: string
          example: "Mahasiswa Del"
        durasi_hari:
          type: integer
          nullable: true
          default: 7
          example: 7

paths:
  /auth/login:
    post:
      summary: Otentikasi pustakawan dan penerbitan Stateless Bearer Token
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: "pustakawan@del.ac.id"
                password:
                  type: string
                  example: "password123"
      responses:
        '200':
          description: Login berhasil dan menerbitkan access_token
        '401':
          description: Kredensial tidak valid (RFC 7807)

  /auth/me:
    get:
      summary: Mendapatkan data profil pustakawan pemilik token aktif
      tags: [Authentication]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profil pemilik token aktif
        '401':
          description: Belum terautentikasi atau token tidak valid

  /auth/logout:
    post:
      summary: Mencabut (revoke) Bearer Token aktif
      tags: [Authentication]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Token berhasil dicabut dan sesi diakhiri

  /bukus:
    get:
      summary: Menampilkan katalog buku terpaginasi (Search, Filter Kategori, Filter Stok, Sorting)
      tags: [Katalog Buku]
      parameters:
        - { name: search, in: query, schema: { type: string }, description: "Pencarian judul, penulis, atau ISBN" }
        - { name: kategori_id, in: query, schema: { type: integer }, description: "Filter ID kategori" }
        - { name: tersedia, in: query, schema: { type: boolean }, description: "Filter hanya buku yang stok > 0" }
        - { name: sort, in: query, schema: { type: string, enum: [judul, penulis, isbn, stok, tahun_terbit] } }
        - { name: dir, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: per_page, in: query, schema: { type: integer, default: 5 } }
      responses:
        '200':
          description: Koleksi buku terpaginasi dengan blok meta dan tautan HATEOAS
    post:
      summary: Menambahkan buku baru ke katalog
      tags: [Katalog Buku]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BukuInput'
      responses:
        '201':
          description: Buku berhasil dibuat (beserta header Location)
        '401':
          description: Akses ditolak (belum ada token)
        '422':
          description: Gagal validasi input (RFC 7807)

  /bukus/{id}:
    get:
      summary: Mengambil detail satu buku beserta relasi riwayat peminjaman
      tags: [Katalog Buku]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Detail buku ditemukan
        '404':
          description: Buku tidak ditemukan
    put:
      summary: Mengganti seluruh representasi atribut buku (PUT Full Replacement)
      tags: [Katalog Buku]
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BukuInput'
      responses:
        '200':
          description: Seluruh representasi buku berhasil diganti
        '404':
          description: Buku tidak ditemukan
    patch:
      summary: Memperbarui sebagian atribut buku (PATCH Partial Update)
      tags: [Katalog Buku]
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                stok: { type: integer }
                judul: { type: string }
      responses:
        '200':
          description: Sebagian atribut berhasil diperbarui
    delete:
      summary: Menghapus buku (Ditolak 409 jika sedang dipinjam aktif)
      tags: [Katalog Buku]
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '204':
          description: Buku berhasil dihapus tanpa body kembalian
        '409':
          description: Konflik integritas bisnis (buku masih dipinjam aktif)

  /bukus/{id}/referensi-eksternal:
    get:
      summary: Pengayaan metadata buku eksternal via REST Consumer (OpenLibrary / Google Books API)
      tags: [Service Consumer]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Metadata buku berhasil diperoleh (didukung mekanisme timeout & fallback)
        '404':
          description: Buku internal atau metadata eksternal tidak ditemukan

  /peminjamans:
    get:
      summary: Daftar transaksi peminjaman terpaginasi
      tags: [Sirkulasi Peminjaman]
      security:
        - BearerAuth: []
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [dipinjam, dikembalikan] } }
        - { name: nim, in: query, schema: { type: string } }
      responses:
        '200':
          description: Daftar peminjaman berhasil diambil
    post:
      summary: Mencatat transaksi peminjaman baru dengan transaksi ACID + lockForUpdate
      tags: [Sirkulasi Peminjaman]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeminjamanInput'
      responses:
        '201':
          description: Peminjaman berhasil dicatat, kuota stok berkurang atomik
        '409':
          description: Duplikasi peminjaman aktif oleh NIM yang sama
        '422':
          description: Stok buku sedang habis (0 tersisa)

  /peminjamans/{id}/kembalikan:
    patch:
      summary: Memproses pengembalian buku secara atomik (+1 stok buku)
      tags: [Sirkulasi Peminjaman]
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Buku berhasil dikembalikan dan stok bertambah kembali
        '409':
          description: Buku sudah pernah dikembalikan sebelumnya